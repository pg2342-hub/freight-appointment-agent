name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Go-live gate against the scripted stand-in (plumbing check, no API key)
        run: |
          pip install "git+https://github.com/pg2342-hub/golive-gate"
          npm run db:init && npm run seed
          printf 'EVAL_TOKEN=ci-local\nMODEL_MODE=scripted\n' > .dev.vars
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api/health && break; sleep 1; done
          cd gate && EVAL_TOKEN=ci-local golive run golive.yml --runs 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: D1 database, schema and seed
        run: scripts/ci_d1.sh
      - name: Deploy the Worker
        run: npx wrangler deploy | tee deploy.log
      - name: Worker secrets
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
          openssl rand -hex 24 | npx wrangler secret put EVAL_TOKEN
      - name: Health check
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Deployed to $url"
          curl -sf "$url/api/health"
