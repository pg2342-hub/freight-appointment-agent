name: Go-live gate (Claude)
# Runs the 25 email threads against the deployed agent with Claude. Costs API credit, so it runs on demand.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per thread
        default: "3"

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci && pip install "git+https://github.com/pg2342-hub/golive-gate"
      - name: Fresh eval token
        run: |
          t=$(openssl rand -hex 24); echo "::add-mask::$t"; echo "EVAL_TOKEN=$t" >> "$GITHUB_ENV"
          printf '%s' "$t" | npx wrangler secret put EVAL_TOKEN
      - name: Find the Worker URL
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.subdomain))')
          echo "AGENT_URL=https://freight-appointment-agent.$sub.workers.dev/eval" >> "$GITHUB_ENV"
      - name: Run the gate
        run: cd gate && golive run golive.yml --agent "$AGENT_URL" --runs "${{ inputs.runs }}" --out ../reports/claude
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gate-report-claude, path: reports/claude }
